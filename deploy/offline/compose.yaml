name: dc-agent-offline

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: dc_agent
      POSTGRES_USER: dc_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - offline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_agent -d dc_agent"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?CLICKHOUSE_IMAGE is required}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_QUERY_USER: ${CLICKHOUSE_QUERY_USER:?CLICKHOUSE_QUERY_USER is required}
      CLICKHOUSE_INGEST_USER: ${CLICKHOUSE_INGEST_USER:?CLICKHOUSE_INGEST_USER is required}
    secrets:
      - clickhouse_query_password
      - clickhouse_ingest_password
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/clickhouse
        target: /var/lib/clickhouse
        bind:
          create_host_path: false
      - type: bind
        source: ./clickhouse-init.sh
        target: /docker-entrypoint-initdb.d/010-dcagent-structured-users.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - offline
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:?CLICKHOUSE_MEMORY_LIMIT is required}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: ${QDRANT_IMAGE:?QDRANT_IMAGE is required}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/qdrant
        target: /qdrant/storage
        bind:
          create_host_path: false
    networks:
      - offline
    mem_limit: ${QDRANT_MEMORY_LIMIT:?QDRANT_MEMORY_LIMIT is required}
    healthcheck:
      test: ["CMD", "bash", "-ec", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/redis
        target: /data
        bind:
          create_host_path: false
    networks:
      - offline
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE is required}
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    networks:
      - offline
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-migration:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?PYTHON_BASE_IMAGE is required}
        DCAGENT_UID: ${DCAGENT_UID:?DCAGENT_UID is required}
        DCAGENT_GID: ${DCAGENT_GID:?DCAGENT_GID is required}
    command: ["python", "-m", "app.migration_entrypoint"]
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    networks:
      - offline

  embedding-service:
    build:
      context: ../..
      dockerfile: deploy/docker/embedding.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?PYTHON_BASE_IMAGE is required}
        DCAGENT_UID: ${DCAGENT_UID:?DCAGENT_UID is required}
        DCAGENT_GID: ${DCAGENT_GID:?DCAGENT_GID is required}
    restart: unless-stopped
    environment:
      OFFLINE_MODE: "true"
      EMBEDDING_RUNTIME: ${EMBEDDING_RUNTIME:?EMBEDDING_RUNTIME is required}
      EMBEDDING_MODEL_SHA256: ${EMBEDDING_MODEL_SHA256:?EMBEDDING_MODEL_SHA256 is required}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:?EMBEDDING_MODEL_VERSION is required}
      EMBEDDING_MODEL_DIMENSIONS: ${EMBEDDING_MODEL_DIMENSIONS:?EMBEDDING_MODEL_DIMENSIONS is required}
      EMBEDDING_MODEL_NORMALIZED: ${EMBEDDING_MODEL_NORMALIZED:?EMBEDDING_MODEL_NORMALIZED is required}
      EMBEDDING_ENCODING_PROFILE_SHA256: ${EMBEDDING_ENCODING_PROFILE_SHA256:?EMBEDDING_ENCODING_PROFILE_SHA256 is required}
      EMBEDDING_PROTOCOL_VERSION: ${EMBEDDING_PROTOCOL_VERSION:?EMBEDDING_PROTOCOL_VERSION is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      OLLAMA_EMBEDDING_PATH: ${OLLAMA_EMBEDDING_PATH:-/api/embed}
      OLLAMA_EMBEDDING_QUERY_PROFILE: ${OLLAMA_EMBEDDING_QUERY_PROFILE:?OLLAMA_EMBEDDING_QUERY_PROFILE is required}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-15}
      LLAMA_CPP_EMBEDDING_URL: ${LLAMA_CPP_EMBEDDING_URL:?LLAMA_CPP_EMBEDDING_URL is required}
      LLAMA_CPP_EMBEDDING_PATH: ${LLAMA_CPP_EMBEDDING_PATH:?LLAMA_CPP_EMBEDDING_PATH is required}
      LLAMA_CPP_EMBEDDING_MODEL: ${LLAMA_CPP_EMBEDDING_MODEL:?LLAMA_CPP_EMBEDDING_MODEL is required}
      LLAMA_CPP_EMBEDDING_TIMEOUT_SECONDS: ${LLAMA_CPP_EMBEDDING_TIMEOUT_SECONDS:?LLAMA_CPP_EMBEDDING_TIMEOUT_SECONDS is required}
      LLAMA_CPP_EMBEDDING_BATCH_MAX_ITEMS: ${LLAMA_CPP_EMBEDDING_BATCH_MAX_ITEMS:?LLAMA_CPP_EMBEDDING_BATCH_MAX_ITEMS is required}
      EMBEDDING_BATCH_MAX_ITEMS: ${EMBEDDING_BATCH_MAX_ITEMS:?EMBEDDING_BATCH_MAX_ITEMS is required}
      EMBEDDING_QUEUE_MAX_ITEMS: ${EMBEDDING_QUEUE_MAX_ITEMS:?EMBEDDING_QUEUE_MAX_ITEMS is required}
      EMBEDDING_BATCH_WAIT_MS: ${EMBEDDING_BATCH_WAIT_MS:?EMBEDDING_BATCH_WAIT_MS is required}
    networks:
      - offline
      - ollama-egress
    cpus: ${EMBEDDING_CPU_LIMIT:?EMBEDDING_CPU_LIMIT is required}
    mem_limit: ${EMBEDDING_MEMORY_LIMIT:?EMBEDDING_MEMORY_LIMIT is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  reranker-service:
    build:
      context: ../..
      dockerfile: deploy/docker/reranker.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?PYTHON_BASE_IMAGE is required}
        DCAGENT_UID: ${DCAGENT_UID:?DCAGENT_UID is required}
        DCAGENT_GID: ${DCAGENT_GID:?DCAGENT_GID is required}
    restart: unless-stopped
    environment:
      OFFLINE_MODE: "true"
      RERANKER_RUNTIME: ${RERANKER_RUNTIME:?RERANKER_RUNTIME is required}
      RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:?RERANKER_MODEL_SHA256 is required}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:?RERANKER_MODEL_NAME is required}
      RERANKER_MODEL_VERSION: ${RERANKER_MODEL_VERSION:?RERANKER_MODEL_VERSION is required}
      RERANKER_PROMPT_PROFILE_SHA256: ${RERANKER_PROMPT_PROFILE_SHA256:?RERANKER_PROMPT_PROFILE_SHA256 is required}
      RERANKER_PROTOCOL_VERSION: ${RERANKER_PROTOCOL_VERSION:?RERANKER_PROTOCOL_VERSION is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_RERANKER_MODEL: ${OLLAMA_RERANKER_MODEL:-}
      OLLAMA_GENERATE_PATH: ${OLLAMA_GENERATE_PATH:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-15}
      OLLAMA_RERANK_FORMAT_JSON: ${OLLAMA_RERANK_FORMAT_JSON:-}
      OLLAMA_RERANK_NUM_PREDICT: ${OLLAMA_RERANK_NUM_PREDICT:-}
      OLLAMA_RERANK_BATCH_MAX_ITEMS: ${OLLAMA_RERANK_BATCH_MAX_ITEMS:-}
      LLAMA_CPP_RERANKER_URL: ${LLAMA_CPP_RERANKER_URL:?LLAMA_CPP_RERANKER_URL is required}
      LLAMA_CPP_RERANKER_PATH: ${LLAMA_CPP_RERANKER_PATH:?LLAMA_CPP_RERANKER_PATH is required}
      LLAMA_CPP_RERANKER_MODEL: ${LLAMA_CPP_RERANKER_MODEL:?LLAMA_CPP_RERANKER_MODEL is required}
      LLAMA_CPP_RERANK_TIMEOUT_SECONDS: ${LLAMA_CPP_RERANK_TIMEOUT_SECONDS:?LLAMA_CPP_RERANK_TIMEOUT_SECONDS is required}
      LLAMA_CPP_RERANK_BATCH_MAX_ITEMS: ${LLAMA_CPP_RERANK_BATCH_MAX_ITEMS:?LLAMA_CPP_RERANK_BATCH_MAX_ITEMS is required}
      RERANKER_BATCH_MAX_ITEMS: ${RERANKER_BATCH_MAX_ITEMS:-}
      RERANKER_QUEUE_MAX_ITEMS: ${RERANKER_QUEUE_MAX_ITEMS:-}
      RERANKER_BATCH_WAIT_MS: ${RERANKER_BATCH_WAIT_MS:-}
    networks:
      - offline
      - ollama-egress
    cpus: ${RERANKER_CPU_LIMIT:-4.0}
    mem_limit: ${RERANKER_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?PYTHON_BASE_IMAGE is required}
        DCAGENT_UID: ${DCAGENT_UID:?DCAGENT_UID is required}
        DCAGENT_GID: ${DCAGENT_GID:?DCAGENT_GID is required}
    restart: unless-stopped
    environment:
      OFFLINE_MODE: "true"
      DATABASE_URL_FILE: /run/secrets/database_url
      STRUCTURED_QUERY_ENABLED: ${STRUCTURED_QUERY_ENABLED:?STRUCTURED_QUERY_ENABLED is required}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      CLICKHOUSE_COMPATIBILITY_MODE: ${CLICKHOUSE_COMPATIBILITY_MODE:?CLICKHOUSE_COMPATIBILITY_MODE is required}
      CLICKHOUSE_QUERY_USER: ${CLICKHOUSE_QUERY_USER:?CLICKHOUSE_QUERY_USER is required}
      CLICKHOUSE_QUERY_PASSWORD_FILE: /run/secrets/clickhouse_query_password
      STRUCTURED_QUERY_TIMEOUT_SECONDS: ${STRUCTURED_QUERY_TIMEOUT_SECONDS:?STRUCTURED_QUERY_TIMEOUT_SECONDS is required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:?QDRANT_COLLECTION_ALIAS is required}
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:?RETRIEVAL_MODE is required}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RETRIEVAL_SHADOW_PERCENT: ${RETRIEVAL_SHADOW_PERCENT:?RETRIEVAL_SHADOW_PERCENT is required}
      RETRIEVAL_CANARY_PERCENT: ${RETRIEVAL_CANARY_PERCENT:?RETRIEVAL_CANARY_PERCENT is required}
      RETRIEVAL_PERMISSION_TAGS: ${RETRIEVAL_PERMISSION_TAGS:?RETRIEVAL_PERMISSION_TAGS is required}
      RETRIEVAL_KNOWLEDGE_BASE_ID: ${RETRIEVAL_KNOWLEDGE_BASE_ID:?RETRIEVAL_KNOWLEDGE_BASE_ID is required}
      RETRIEVAL_DENSE_TOP_K: ${RETRIEVAL_DENSE_TOP_K:?RETRIEVAL_DENSE_TOP_K is required}
      RETRIEVAL_SPARSE_TOP_K: ${RETRIEVAL_SPARSE_TOP_K:?RETRIEVAL_SPARSE_TOP_K is required}
      RETRIEVAL_RERANK_TOP_K: ${RETRIEVAL_RERANK_TOP_K:?RETRIEVAL_RERANK_TOP_K is required}
      RETRIEVAL_DEGRADED_RERANK_TOP_K: ${RETRIEVAL_DEGRADED_RERANK_TOP_K:?RETRIEVAL_DEGRADED_RERANK_TOP_K is required}
      RETRIEVAL_FINAL_TOP_K: ${RETRIEVAL_FINAL_TOP_K:?RETRIEVAL_FINAL_TOP_K is required}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:?RETRIEVAL_RRF_K is required}
      RETRIEVAL_TOTAL_TIMEOUT_SECONDS: ${RETRIEVAL_TOTAL_TIMEOUT_SECONDS:?RETRIEVAL_TOTAL_TIMEOUT_SECONDS is required}
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
      RERANKER_SERVICE_URL: ${RERANKER_SERVICE_URL:-http://reranker-service:8082}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:?EMBEDDING_MODEL_VERSION is required}
      EMBEDDING_MODEL_SHA256: ${EMBEDDING_MODEL_SHA256:?EMBEDDING_MODEL_SHA256 is required}
      EMBEDDING_MODEL_DIMENSIONS: ${EMBEDDING_MODEL_DIMENSIONS:?EMBEDDING_MODEL_DIMENSIONS is required}
      EMBEDDING_MODEL_NORMALIZED: ${EMBEDDING_MODEL_NORMALIZED:?EMBEDDING_MODEL_NORMALIZED is required}
      EMBEDDING_ENCODING_PROFILE_SHA256: ${EMBEDDING_ENCODING_PROFILE_SHA256:?EMBEDDING_ENCODING_PROFILE_SHA256 is required}
      EMBEDDING_PROTOCOL_VERSION: ${EMBEDDING_PROTOCOL_VERSION:?EMBEDDING_PROTOCOL_VERSION is required}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-}
      RERANKER_MODEL_VERSION: ${RERANKER_MODEL_VERSION:-}
      RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:-}
      RERANKER_PROMPT_PROFILE_SHA256: ${RERANKER_PROMPT_PROFILE_SHA256:-}
      RERANKER_PROTOCOL_VERSION: ${RERANKER_PROTOCOL_VERSION:-}
      SPARSE_MODEL_ROOT: /models/${SPARSE_MODEL_DIR:?SPARSE_MODEL_DIR is required}
      SPARSE_PROFILE_SHA256: ${SPARSE_PROFILE_SHA256:?SPARSE_PROFILE_SHA256 is required}
      LLAMA_SERVER_URL: http://llama:8080
      MODEL_SLOTS: ${MODEL_SLOTS:?MODEL_SLOTS is required}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_API_BASE: ${LLM_API_BASE:?LLM_API_BASE is required}
      LLM_STREAM_PATH: ${LLM_STREAM_PATH:-/api/physoc/deepseeks/stream}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      RAW_DATA_ROOT: /data/raw
      PARQUET_ROOT: /data/parquet
      MODEL_ROOT: /models
      DOCLING_ARTIFACTS_PATH: /models/docling
      PADDLEOCR_HOME: /models/paddleocr
      LIBREOFFICE_BIN: /usr/bin/libreoffice
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
    secrets:
      - database_url
      - clickhouse_query_password
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/raw
        target: /data/raw
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/parquet
        target: /data/parquet
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_ROOT:?MODEL_ROOT is required}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      schema-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - offline
      - physoc-egress

  ingestion-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?PYTHON_BASE_IMAGE is required}
        DCAGENT_UID: ${DCAGENT_UID:?DCAGENT_UID is required}
        DCAGENT_GID: ${DCAGENT_GID:?DCAGENT_GID is required}
    restart: unless-stopped
    command: ["python", "-m", "app.structured_worker"]
    environment:
      OFFLINE_MODE: "true"
      DATABASE_URL_FILE: /run/secrets/database_url
      STRUCTURED_QUERY_ENABLED: ${STRUCTURED_QUERY_ENABLED:?STRUCTURED_QUERY_ENABLED is required}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:?CLICKHOUSE_URL is required}
      CLICKHOUSE_COMPATIBILITY_MODE: ${CLICKHOUSE_COMPATIBILITY_MODE:?CLICKHOUSE_COMPATIBILITY_MODE is required}
      CLICKHOUSE_INGEST_USER: ${CLICKHOUSE_INGEST_USER:?CLICKHOUSE_INGEST_USER is required}
      CLICKHOUSE_INGEST_PASSWORD_FILE: /run/secrets/clickhouse_ingest_password
      STRUCTURED_INGEST_BATCH_ROWS: ${STRUCTURED_INGEST_BATCH_ROWS:?STRUCTURED_INGEST_BATCH_ROWS is required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:?QDRANT_COLLECTION_ALIAS is required}
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:?RETRIEVAL_MODE is required}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RETRIEVAL_SHADOW_PERCENT: ${RETRIEVAL_SHADOW_PERCENT:?RETRIEVAL_SHADOW_PERCENT is required}
      RETRIEVAL_CANARY_PERCENT: ${RETRIEVAL_CANARY_PERCENT:?RETRIEVAL_CANARY_PERCENT is required}
      RETRIEVAL_PERMISSION_TAGS: ${RETRIEVAL_PERMISSION_TAGS:?RETRIEVAL_PERMISSION_TAGS is required}
      RETRIEVAL_KNOWLEDGE_BASE_ID: ${RETRIEVAL_KNOWLEDGE_BASE_ID:?RETRIEVAL_KNOWLEDGE_BASE_ID is required}
      RETRIEVAL_DENSE_TOP_K: ${RETRIEVAL_DENSE_TOP_K:?RETRIEVAL_DENSE_TOP_K is required}
      RETRIEVAL_SPARSE_TOP_K: ${RETRIEVAL_SPARSE_TOP_K:?RETRIEVAL_SPARSE_TOP_K is required}
      RETRIEVAL_RERANK_TOP_K: ${RETRIEVAL_RERANK_TOP_K:?RETRIEVAL_RERANK_TOP_K is required}
      RETRIEVAL_DEGRADED_RERANK_TOP_K: ${RETRIEVAL_DEGRADED_RERANK_TOP_K:?RETRIEVAL_DEGRADED_RERANK_TOP_K is required}
      RETRIEVAL_FINAL_TOP_K: ${RETRIEVAL_FINAL_TOP_K:?RETRIEVAL_FINAL_TOP_K is required}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:?RETRIEVAL_RRF_K is required}
      RETRIEVAL_TOTAL_TIMEOUT_SECONDS: ${RETRIEVAL_TOTAL_TIMEOUT_SECONDS:?RETRIEVAL_TOTAL_TIMEOUT_SECONDS is required}
      EMBEDDING_SERVICE_URL: http://embedding-service:8081
      RERANKER_SERVICE_URL: ${RERANKER_SERVICE_URL:-http://reranker-service:8082}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:?EMBEDDING_MODEL_VERSION is required}
      EMBEDDING_MODEL_SHA256: ${EMBEDDING_MODEL_SHA256:?EMBEDDING_MODEL_SHA256 is required}
      EMBEDDING_MODEL_DIMENSIONS: ${EMBEDDING_MODEL_DIMENSIONS:?EMBEDDING_MODEL_DIMENSIONS is required}
      EMBEDDING_MODEL_NORMALIZED: ${EMBEDDING_MODEL_NORMALIZED:?EMBEDDING_MODEL_NORMALIZED is required}
      EMBEDDING_ENCODING_PROFILE_SHA256: ${EMBEDDING_ENCODING_PROFILE_SHA256:?EMBEDDING_ENCODING_PROFILE_SHA256 is required}
      EMBEDDING_PROTOCOL_VERSION: ${EMBEDDING_PROTOCOL_VERSION:?EMBEDDING_PROTOCOL_VERSION is required}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-}
      RERANKER_MODEL_VERSION: ${RERANKER_MODEL_VERSION:-}
      RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:-}
      RERANKER_PROMPT_PROFILE_SHA256: ${RERANKER_PROMPT_PROFILE_SHA256:-}
      RERANKER_PROTOCOL_VERSION: ${RERANKER_PROTOCOL_VERSION:-}
      SPARSE_MODEL_ROOT: /models/${SPARSE_MODEL_DIR:?SPARSE_MODEL_DIR is required}
      SPARSE_PROFILE_SHA256: ${SPARSE_PROFILE_SHA256:?SPARSE_PROFILE_SHA256 is required}
      RAW_DATA_ROOT: /data/raw
      PARQUET_ROOT: /data/parquet
      MODEL_ROOT: /models
      DOCLING_ARTIFACTS_PATH: /models/docling
      PADDLEOCR_HOME: /models/paddleocr
      LIBREOFFICE_BIN: /usr/bin/libreoffice
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
    secrets:
      - database_url
      - clickhouse_ingest_password
    volumes:
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/raw
        target: /data/raw
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT:?DATA_ROOT is required}/parquet
        target: /data/parquet
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_ROOT:?MODEL_ROOT is required}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      schema-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - offline
    profiles: ["indexing"]

  llama:
    image: ${LLAMA_IMAGE:?LLAMA_IMAGE is required}
    restart: unless-stopped
    command:
      ["--model", "/models/${LLAMA_MODEL_FILE:?LLAMA_MODEL_FILE is required}", "--host", "0.0.0.0", "--port", "8080", "--parallel", "${MODEL_SLOTS:?MODEL_SLOTS is required}"]
    volumes:
      - type: bind
        source: ${MODEL_ROOT:?MODEL_ROOT is required}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks:
      - offline
    profiles: ["generation"]

networks:
  offline:
    internal: true
  physoc-egress:
    internal: false
  ollama-egress:
    internal: false

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?DATABASE_URL_SECRET_FILE is required}
  clickhouse_query_password:
    file: ${CLICKHOUSE_QUERY_PASSWORD_FILE:?CLICKHOUSE_QUERY_PASSWORD_FILE is required}
  clickhouse_ingest_password:
    file: ${CLICKHOUSE_INGEST_PASSWORD_FILE:?CLICKHOUSE_INGEST_PASSWORD_FILE is required}
