[project]
name = "dc-agent-backend"
dynamic = ["version"]
description = "DC-Agent backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "asynctor>=0.13.2",
    "clickhouse-connect>=0.8",
    "fastapi>=0.116.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.0",
    "loguru>=0.7",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.20",
    "redis>=5",
    "sqlglot>=27",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
offline = [
    "qdrant-client>=1.14",
    "polars>=1.30",
    "pyarrow>=19",
    "pyxlsb>=1.0",
    "docling>=2.40",
    "paddlepaddle>=3",
    "paddleocr>=3",
    "jieba>=0.42",
    "FlagEmbedding>=1.3",
    "onnxruntime>=1.22",
    "fastembed>=0.7",
    "numpy>=2",
    "openvino>=2025",
    "optimum[onnxruntime]>=1.27",
    "optimum-intel[openvino]>=1.24",
    "torch>=2.7",
    "transformers>=4.53",
    "psycopg[binary]>=3.2",
    "psutil>=7",
]
benchmark = [{ include-group = "offline" }, "locust>=2.37"]
dev = ["fastapi-cli>=0.0.32"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pdm]
distribution = false

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["uploads"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
